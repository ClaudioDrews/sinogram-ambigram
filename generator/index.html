<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinogram Ambigram Generator | Experimental</title>
<style>
:root{--bg:#f6f6f2;--ink:#18332e;--line:#dbe3dd;--green:#175f51;--light:#edf4ef;--muted:#61746d;--warm:#b96a3e}*{box-sizing:border-box}
body{font:15px/1.55 system-ui,'Noto Sans CJK JP','Noto Sans CJK SC',sans-serif;background:var(--bg);margin:0;color:var(--ink)}
main{max-width:1120px;margin:auto;padding:28px 18px 66px}header{border-bottom:1px solid var(--line);padding:12px 0 24px}
h1{font-size:clamp(31px,4.5vw,52px);line-height:1.15;letter-spacing:-.035em;margin:7px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}
p{margin:8px 0 14px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:.16em;font-weight:750;text-transform:uppercase}.muted{color:var(--muted)}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;margin-top:20px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 6px}input,select,button{font:inherit}input[type=text],select{border:1px solid #b9cac0;border-radius:9px;padding:10px 12px;background:white;color:var(--ink);width:100%}input[type=text]{font-size:24px;max-width:100%}
button{background:white;color:var(--ink);border:1px solid #b5c7bd;border-radius:9px;padding:10px 13px;cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a4d7bf;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status{background:var(--light);padding:10px 12px;border-left:3px solid var(--green);border-radius:7px;font-size:13px}.status.warn{background:#fff5ea;border-left-color:var(--warm)}
.stage{min-height:335px;display:grid;place-items:center;background:#fafcf9;border:1px solid var(--line);border-radius:12px;overflow:hidden}.stage svg{width:min(100%,355px);aspect-ratio:1;transition:transform .35s ease}.stage svg.flipped{transform:rotate(180deg)}
.target{display:flex;gap:12px;align-items:center}.target svg{width:90px;height:90px;border:1px solid var(--line);border-radius:8px;background:#fafcf9}.target .g{font-size:25px;font-weight:650}.target .arrow{font-size:24px;color:var(--green)}
.small{font-size:12px}.caption{font-size:12px;color:var(--muted)}.candidates{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}.candidate{display:flex;align-items:center;text-align:left;width:100%;justify-content:space-between;padding:10px 12px}.candidate.sel{border-color:var(--green);background:var(--light)}.candidate .chars{font-size:21px;min-width:70px}.candidate small{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:115px 1fr;gap:6px 12px;font-size:13px}.kv dt{font-weight:650}.kv dd{margin:0}.sep{height:1px;background:var(--line);margin:18px 0}#feedback{overflow-wrap:anywhere}
a{color:var(--green)}.footer{color:var(--muted);font-size:12px;margin-top:25px;border-top:1px solid var(--line);padding-top:15px}
#busy{display:none}#busy.show{display:block}.hidden{display:none!important}@media(max-width:840px){.layout{grid-template-columns:1fr}.panel{padding:17px}.stage{min-height:265px}.target svg{width:70px;height:70px}}@media(prefers-reduced-motion:reduce){.stage svg{transition:none}}
</style></head><body>
<main><header><div class="row" style="justify-content:space-between"><span class="eyebrow">Sinogram Ambigrams · Browser proof of concept</span><select id="lang" aria-label="Language" style="max-width:145px"><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select></div><h1 id="title">Ambigram Generator</h1><p class="muted" id="intro"></p></header>
<div class="layout"><section class="panel"><div class="eyebrow" id="searchHeader">Explore a character</div>
<form id="form"><label for="character" id="inputLabel">Character</label><input id="character" type="text" inputmode="text" autocomplete="off" maxlength="4" value="甲" spellcheck="false" required>
<label for="language" id="writingLabel">Writing system</label><select id="language"><option value="ja">Japanese kanji</option><option value="zh">Chinese hanzi</option></select>
<button type="submit" class="primary" id="findBtn" style="margin-top:12px;width:100%">Generate candidates</button></form>
<p id="busy" class="muted small" role="status">Loading strokes…</p><div id="status" class="status" style="margin-top:15px" role="status"></div>
<div class="sep"></div><h2 id="candidateTitle">Candidate designs</h2><div id="candidates" class="candidates"></div>
<div class="sep"></div><h2 id="controlsTitle">Construction</h2>
<label for="mode" id="methodLabel">Method</label><select id="mode"><option value="salience">Stroke salience blend</option><option value="overlay">Geometric overlay</option><option value="shared">Shared stroke structure</option><option value="symmetry">C₂ symmetry</option></select>
<label for="tau" id="proximityLabel">Stroke proximity</label><input id="tau" type="range" min="0.5" max="6" step="0.25" value="1.75" style="width:75%;accent-color:var(--green)"><output id="tauValue">1.75</output>
</section><section class="panel"><div class="row" style="justify-content:space-between"><div><span class="eyebrow" id="resultHeader">Generated design</span><h2 id="resultTitle">甲 ↔ 由</h2></div><span id="score" class="caption"></span></div>
<div class="stage" id="stage"><svg id="art" viewBox="0 0 109 109" role="img" aria-label="Ambigram candidate"></svg></div>
<div class="row" style="margin-top:12px"><button id="turn" type="button">Rotate 180°</button><button id="download" type="button">Save SVG</button><span id="orientation" class="caption"></span></div>
<div class="row" style="margin:14px 0 6px"><div class="target"><span id="glyphA"></span><span class="arrow">↔</span><span id="glyphB"></span></div><div id="direction" class="muted small"></div></div>
<div class="sep"></div><h2 id="explainTitle">How this was generated</h2><p id="explain"></p><dl class="kv"><dt id="sourceLabel">Data source</dt><dd id="sourceDetail"></dd><dt id="evaluationLabel">Interpretation</dt><dd id="evaluationDetail"></dd></dl>
<div class="sep"></div><h2 id="feedbackTitle">Help improve the result</h2><p class="small muted" id="feedbackIntro"></p><div class="row"><button type="button" id="copyFeedback">Copy feedback</button><a href="https://github.com/ClaudioDrews" id="authorLink">Author on GitHub</a></div><p id="feedback" class="caption"></p>
</section></div><footer class="footer" id="footer"></footer></main>

async function search(){const id=++generation;const raw=$('character').value.trim();const chars=Array.from(raw);lastInput=raw;turned=false;

function render(){const t=T(),art=$('art');art.replaceChildren();$('tauValue').textContent=Number($('tau').value).toFixed(2);$('stage').querySelector('svg').classList.toggle('flipped',turned);$('orientation').textContent=turned?t.rotated:t.upright;

 $('download').disabled=false;const {a,b,H,semantic,origin}=selected,tau=Number($('tau').value),mode=$('mode').value,flip='rotate(180 54.5 54.5)';
 $('resultTitle').textContent=mode==='symmetry'?a+' ↔ '+a+' (C₂)':a+' ↔ '+b;$('score').textContent=mode==='symmetry'?t.self:`H = ${H.toFixed(4)}`;
