<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A simple native-reader gallery: tap to turn a generated sinogram ambigram 180° and report meaning in both orientations.">
<meta name="theme-color" content="#f3eee3">
<title>Sinogram Ambigrams · Reader Gallery</title>
<style>
:root{--paper:#f3eee3;--sheet:#fcfaf4;--ink:#26231f;--soft:#686054;--line:#d8d0c3;--red:#a94731;--redwash:#f8e8df;--serif:Georgia,"Noto Serif CJK SC","Noto Serif CJK JP",serif;--sans:system-ui,"Noto Sans CJK SC","Noto Sans CJK JP",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.hidden{display:none!important}
.wrap{width:min(700px,calc(100% - 32px));margin-inline:auto}
header{border-bottom:1px solid var(--line);background:var(--sheet)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:66px}
.brand{font:700 18px var(--serif);color:var(--ink);text-decoration:none}
.brand span{color:var(--red)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--red)}
h1{font:700 clamp(34px,6vw,51px)/1.16 var(--serif);letter-spacing:-.026em;margin:14px 0 18px}
p{margin:0 0 15px}
main{padding:44px 0 70px}
.lead{font-size:18px;color:var(--soft);max-width:580px}
.selection{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:32px 0}
.language-card{background:var(--sheet);border:1px solid var(--line);border-radius:15px;min-height:178px;text-align:left;padding:23px 21px;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
.language-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 8px 24px #33251b13}
.language-card strong{font:700 clamp(32px,6vw,45px)/1.25 var(--serif);display:block;margin-bottom:10px}
.language-card span{display:block;font-size:14px;color:var(--soft)}
.small{font-size:13px;color:var(--soft)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}
.progress{font:700 13px var(--sans);color:var(--soft)}
h2{font:700 clamp(20px,4vw,29px)/1.35 var(--serif);margin:0 0 15px}
.instructions{text-align:center;color:var(--soft);font-size:15px;margin:0 0 13px}
.glyph-button{width:100%;border:1px solid var(--line);border-radius:17px;background:var(--sheet);min-height:310px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:10px}
.glyph-button:hover{border-color:var(--red)}
.glyph{display:block;width:min(88%,460px);height:88%;object-fit:contain;transform:rotate(0deg);transform-origin:50% 50%;transition:transform 950ms cubic-bezier(.28,.06,.23,1);pointer-events:none;user-select:none;-webkit-user-drag:none}
.angle{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);padding:3px 13px;border-radius:30px;font:700 12px var(--sans);color:var(--soft)}
.formgroup{margin-top:27px}
.legend{font-size:16px;font-weight:700;display:block;margin-bottom:12px}
.choices{display:grid;gap:9px}
.choice{border:1px solid var(--line);border-radius:11px;background:var(--sheet);display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer}
.choice:has(input:checked){background:var(--redwash);border-color:var(--red)}
.choice input{accent-color:var(--red);width:18px;height:18px;flex:0 0 auto}
.method{margin-top:24px;font-size:13px;color:var(--soft);border-top:1px solid var(--line);padding-top:15px}
.method strong{color:var(--ink);font-weight:700}
.notes{display:block;margin-top:22px;font-weight:700;font-size:14px}
textarea{display:block;width:100%;min-height:99px;margin-top:9px;resize:vertical;background:var(--sheet);color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
.primary,.secondary{border-radius:30px;padding:12px 25px;min-height:46px;font-weight:700;font-size:15px}
.primary{background:var(--ink);color:var(--sheet);border:1px solid var(--ink)}
.primary:hover{background:var(--red);border-color:var(--red)}
.secondary{color:var(--ink);background:var(--sheet);border:1px solid var(--line)}
.secondary:hover{border-color:var(--red)}
.warning{min-height:22px;margin-top:12px;font-size:13px;color:var(--red)}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:15px;padding:25px;margin-top:22px}
footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--soft)}
footer a{color:var(--red)}
@media(max-width:500px){main{padding-top:29px}.selection{grid-template-columns:1fr;gap:11px;margin-top:25px}.language-card{min-height:120px;padding:18px}.language-card strong{font-size:33px;margin-bottom:5px}.glyph-button{min-height:0}.wrap{width:calc(100% - 28px)}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="../../">Sinogram <span>↻</span> Ambigrams</a><span class="eyebrow">READER GALLERY</span></div></header>
<main class="wrap">
<section id="home">
 <div class="eyebrow">180° · 汉字 · 漢字</div>
 <h1>旋转阅读 · 回転して読む</h1>
 <p class="lead">选择要评价的文字。点击图形，它将旋转 180°。</p>
 <p class="lead">評価する文字を選んでください。図形をタップすると180°回転します。</p>
 <div class="selection">
  <button type="button" class="language-card" id="choose-cn"><strong>汉字</strong><span>中文 · Chinese characters</span></button>
  <button type="button" class="language-card" id="choose-jp"><strong>漢字</strong><span>日本語 · Japanese characters</span></button>
 </div>
 <p class="small">每次仅显示一种文字。 / 一度に一つの言語の文字だけを表示します。</p>
 <p class="small" id="home-error" role="alert"></p>
</section>
<section id="gallery" class="hidden">
 <div class="topline"><span id="track-label" class="eyebrow"></span><span class="progress" id="progress"></span></div>
 <h2 id="gallery-title"></h2>
 <p class="instructions" id="tap-hint"></p>
 <button type="button" class="glyph-button" id="rotate" aria-label="Rotate drawing 180 degrees">
  <img class="glyph" id="glyph" alt="Experimental ambigram drawing" draggable="false">
  <span class="angle" id="angle">0°</span>
 </button>
 <div class="formgroup">
  <span class="legend" id="question"></span>
  <div class="choices" id="choices" role="radiogroup"></div>
 </div>
 <div class="method"><span id="method-title"></span> <strong id="method-value"></strong></div>
 <label class="notes" for="note" id="notes-title"></label>
 <textarea id="note" maxlength="2000"></textarea>
 <div class="actions"><button type="button" class="primary" id="next"></button></div>
 <p class="warning" id="warning" role="alert"></p>
</section>
<section id="done" class="hidden">
 <div class="eyebrow">READER GALLERY · 180°</div>
 <h1 id="done-title"></h1>
 <p class="lead" id="done-description"></p>
 <div class="panel">
  <p id="done-count"></p>
  <div class="actions">
   <button type="button" class="primary" id="download-csv">CSV</button>
   <button type="button" class="secondary" id="download-txt">TXT</button>
  </div>
  <p class="small" id="done-privacy" style="margin-top:18px"></p>
 </div>
</section>
<footer><p id="privacy">回答不会自动发送。 / 回答は自動送信されません。</p><a href="https://github.com/ClaudioDrews/sinogram-ambigram">GitHub · Sinogram Ambigrams</a></footer>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const texts={
 cn:{
  track:"中文汉字",title:"这个图形能表达意义吗？",tap:"点击图形，观看它旋转 180°。可再次点击旋转。",
  question:"在哪些方向上，你能读出意义？",choices:["两个方向都能读出意义","只有一个方向能读出意义","两个方向都不能读出意义"],
  method:"生成方法：",notes:"观察与备注（选填）",next:"下一个图形",finish:"完成评价",
  rotate:"点击将图形旋转180°。当前方向：",needTurn:"请先点击图形，至少看一次180°旋转。",needChoice:"请选择一个评价选项。",
  done:"评价完成",description:"感谢你的观察。如果愿意，可以下载文件并发送给研究者。",count:"已评价图形：",
  privacy:"文件仅在你的设备上生成，不会自动发送。",error:"无法加载图形。请检查网络连接后刷新页面。",
  methodCN:"原字形矢量合成 · PRC 候选（未优化）",methodV1:"笔画显著性构造 · v1",methodV2:"笔画显著性构造 · v2"
 },
 jp:{
  track:"日本語の漢字",title:"この図形は意味を持って読めますか？",tap:"図形をタップすると180°回転します。もう一度タップするとさらに回転します。",
  question:"どちらの向きで意味を読み取れますか？",choices:["両方の向きで意味が読み取れる","片方の向きだけ意味が読み取れる","どちらの向きも意味が読み取れない"],
  method:"生成方法：",notes:"観察・コメント（任意）",next:"次の図形",finish:"評価を終了",
  rotate:"図形を180°回転します。現在の角度：",needTurn:"評価前に図形をタップして180°回転させてください。",needChoice:"評価を一つ選んでください。",
  done:"評価終了",description:"ご協力ありがとうございました。希望する場合だけ、ファイルをダウンロードして研究者に送ってください。",count:"評価した図形：",
  privacy:"ファイルはお使いの端末で作成され、自動送信されません。",error:"図形を読み込めませんでした。通信を確認して再読み込みしてください。",
  methodCN:"原字形ベクトル合成 · PRC候補（未最適化）",methodV1:"ストローク顕著性構築 · v1",methodV2:"ストローク顕著性構築 · v2"
 }
};
const SOURCE='https://raw.githubusercontent.com/skishore/makemeahanzi/bddc96d41bef78427ed0e034e9f7e31d71fd1b92/svgs/';
let track='',items=[],position=0,turns=0,results=[],seed=0;
function svgData(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function choose(list){const x=list.slice();let state=seed>>>0;const rand=()=>{let t=state+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296};for(let i=x.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function scoreMethod(stratum){return stratum==='v1-top'?'stroke-salience-v1':'stroke-salience-v2'}
async function japaneseItems(){
 const response=await fetch('../items.json');
 if(!response.ok)throw Error('Japanese catalog: HTTP '+response.status);
 const data=await response.json();
 if(!Array.isArray(data.items))throw Error('Japanese items missing');
 const selected=['v1-top','v2-top'].flatMap(group=>data.items.filter(x=>x.stratum===group).slice(0,6));
 if(selected.length!==12)throw Error('Twelve generated Japanese examples expected');
 return selected.map(x=>({id:x.id,track:'jp',a:x.label_a,b:x.label_b,method:scoreMethod(x.stratum),source:'KanjiVG generated evaluation pilot',svg:x.construction_svg}));
}
const sourceCache=new Map();
function finishedPaths(char){
 if(!sourceCache.has(char))sourceCache.set(char,(async()=>{
  const response=await fetch(SOURCE+char.codePointAt(0)+'.svg');
  if(!response.ok)throw Error('Source outline: HTTP '+response.status);
  const doc=new DOMParser().parseFromString(await response.text(),'image/svg+xml');
  if(doc.querySelector('parsererror'))throw Error('Invalid source geometry');
  const group=[...doc.querySelectorAll('g[transform]')].find(g=>/scale\(1,\s*-1\)\s*translate\(0,\s*-900\)/.test(g.getAttribute('transform')||''));
  if(!group)throw Error('Source outline group not found');
  const paths=[...group.children].filter(n=>n.localName==='path'&&n.getAttribute('fill')==='lightgray'&&n.getAttribute('d')).map(n=>n.getAttribute('d'));
  if(!paths.length)throw Error('Finished outline paths missing');
  return paths;
 })());
 return sourceCache.get(char);
}
function pathsMarkup(paths){return paths.map(d=>'<path d="'+d.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"/>').join('')}
function composite(pathsA,pathsB){
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="#26231f">'+
 '<g transform="scale(1 -1) translate(0 -900)">'+pathsMarkup(pathsA)+'</g>'+
 '<g transform="rotate(180 512 512)"><g transform="scale(1 -1) translate(0 -900)">'+pathsMarkup(pathsB)+'</g></g></svg>';
}
async function chineseItems(){
 const response=await fetch('../../prc/catalog.json');
 if(!response.ok)throw Error('PRC catalog: HTTP '+response.status);
 const data=await response.json();
 if(data.schema!=='prc-public-coarse-catalog-v1'||data.region!=='cn-s'||!data.partners||data.human_readability_validated!==false)throw Error('PRC provenance mismatch');
 const anchors=['甲','由','王','玉','目','田','回','国','上','下','日','昌'],chosen=[],seen=new Set();
 for(const a of anchors){
  const options=data.partners[a]||[];
  const best=options.find(x=>Array.isArray(x)&&x[0]!==a&&!seen.has([a,x[0]].sort().join(':')))||options[0];
  if(!best)continue;
  const b=best[0],key=[a,b].sort().join(':');
  if(seen.has(key))continue;
  seen.add(key);chosen.push({id:'prc-'+a.codePointAt(0)+'-'+b.codePointAt(0),track:'cn',a,b,method:'prc-source-vector-union',source:'Make Me a Hanzi · pinned source',svg:''});
 }
 const built=await Promise.all(chosen.map(async item=>{
  try{const [a,b]=await Promise.all([finishedPaths(item.a),finishedPaths(item.b)]);item.svg=composite(a,b);return item;}
  catch(error){console.warn('Unavailable candidate',item.id,error);return null;}
 }));
 const available=built.filter(Boolean);
 if(!available.length)throw Error('No PRC source candidates available');
 return available;
}
function show(id){for(const name of ['home','gallery','done'])$(name).classList.toggle('hidden',name!==id);window.scrollTo(0,0)}
function methodText(method){const t=texts[track];if(method==='stroke-salience-v1')return t.methodV1;if(method==='stroke-salience-v2')return t.methodV2;return t.methodCN}
function render(){
 const t=texts[track],item=items[position];
 $('track-label').textContent=t.track;
 $('gallery-title').textContent=t.title;
 $('tap-hint').textContent=t.tap;
 $('question').textContent=t.question;
 $('method-title').textContent=t.method;
 $('method-value').textContent=methodText(item.method);
 $('notes-title').textContent=t.notes;
 $('next').textContent=position===items.length-1?t.finish:t.next;
 $('progress').textContent=(position+1)+' / '+items.length;
 $('warning').textContent='';
 $('note').value='';
 $('choices').replaceChildren();
 t.choices.forEach((label,index)=>{
  const option=document.createElement('label');option.className='choice';
  const input=document.createElement('input');input.type='radio';input.name='assessment';input.value=String(2-index);
  const span=document.createElement('span');span.textContent=label;
  option.append(input,span);$('choices').appendChild(option);
 });
 turns=0;
 const image=$('glyph');
 image.style.transition='none';
 image.style.transform='rotate(0deg)';
 image.src=svgData(item.svg);
 $('angle').textContent='0°';
 $('rotate').setAttribute('aria-label',t.rotate+'0°');
 void image.offsetWidth;
 requestAnimationFrame(()=>{image.style.transition='';});
 show('gallery');
}
function rotate(){
 if(!items.length)return;
 turns+=1;
 const degrees=180*turns;
 $('glyph').style.transition='';
 $('glyph').style.transform='rotate('+degrees+'deg)';
 $('angle').textContent=(degrees%360)+'°';
 $('rotate').setAttribute('aria-label',texts[track].rotate+(degrees%360)+'°');
 $('warning').textContent='';
}
function next(){
 const t=texts[track],answer=document.querySelector('input[name="assessment"]:checked');
 if(turns<1){$('warning').textContent=t.needTurn;return;}
 if(!answer){$('warning').textContent=t.needChoice;return;}
 const item=items[position];
 results.push({position:position+1,id:item.id,track,method:item.method,source:item.source,intended_a:item.a,intended_b:item.b,meaning_orientations:Number(answer.value),turn_count:turns,observation:$('note').value.trim()});
 position+=1;
 if(position===items.length){complete();return;}
 render();
}
function complete(){
 show('done');
 const t=texts[track];
 $('done-title').textContent=t.done;
 $('done-description').textContent=t.description;
 $('done-count').textContent=t.count+results.length;
 $('done-privacy').textContent=t.privacy;
}
function report(){
 return {schema:'sinogram-simple-reader-v1',track,seed,explanation:'0 = neither orientation meaningful; 1 = one orientation meaningful; 2 = both orientations meaningful',answers:results};
}
function csv(){
 const keys=['position','id','track','method','source','intended_a','intended_b','meaning_orientations','turn_count','observation'];
 const enc=value=>'"'+String(value??'').replace(/"/g,'""')+'"';
 return '\uFEFF'+[keys.map(enc).join(','),...results.map(row=>keys.map(k=>enc(row[k])).join(','))].join('\r\n')+'\r\n';
}
function txt(){
 const values=['Sinogram Ambigrams · Reader Gallery','Track: '+track,'Evaluated: '+results.length,'Rating: 0=neither, 1=one, 2=both',''];
 for(const x of results){values.push(x.position+'. '+x.id+' | method: '+x.method+' | meaning: '+x.meaning_orientations+'/2 | turns: '+x.turn_count);values.push('Notes: '+(x.observation||'—'));values.push('');}
 return values.join('\n');
}
function download(ext,body,mime){
 const blob=new Blob([body],{type:mime}),href=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=href;link.download='sinogram-reader-'+track+'-'+seed+'.'+ext;
 document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),2000);
}
async function start(which){
 track=which;position=0;turns=0;results=[];
 const random=new Uint32Array(1);crypto.getRandomValues(random);seed=random[0];
 const cn=$('choose-cn'),jp=$('choose-jp');
 cn.disabled=true;jp.disabled=true;
 $('home-error').textContent=which==='cn'?'正在加载图形…':'図形を読み込んでいます…';
 try{
  items=choose(await (which==='cn'?chineseItems():japaneseItems()));
  if(!items.length)throw Error('Empty gallery');
  render();
 }catch(error){
  console.error(error);$('home-error').textContent=texts[which].error;cn.disabled=false;jp.disabled=false;
 }
}
$('choose-cn').addEventListener('click',()=>start('cn'));
$('choose-jp').addEventListener('click',()=>start('jp'));
$('rotate').addEventListener('click',rotate);
$('next').addEventListener('click',next);
$('download-csv').addEventListener('click',()=>download('csv',csv(),'text/csv;charset=utf-8'));
$('download-txt').addEventListener('click',()=>download('txt',txt(),'text/plain;charset=utf-8'));
})();
</script>
</body>
</html>
