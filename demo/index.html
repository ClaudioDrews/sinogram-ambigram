<style>
:root{--bg:#f6f5f0;--ink:#1d2c2b;--sub:#647370;--line:#dde5df;--card:#fff;--green:#237063;--gold:#be7443}*{box-sizing:border-box}a{color:var(--green);text-underline-offset:3px}body{margin:0;background:var(--bg);font:15px/1.55 system-ui,'Noto Sans CJK JP',sans-serif;color:var(--ink)}.wrap{max-width:1150px;margin:auto;padding:34px 18px 65px}h1{font-size:clamp(32px,5vw,55px);letter-spacing:-.045em;margin:4px 0}h2{font-size:20px;margin:6px 0 14px}p{margin:8px 0 15px}header{padding-bottom:19px;border-bottom:1px solid var(--line)}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:700}.muted{color:var(--sub)}.grid{display:grid;grid-template-columns:minmax(0,1.17fr) minmax(310px,.83fr);gap:18px;margin-top:22px}.box{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:22px}.stage{display:flex;justify-content:center;align-items:center;min-height:330px;background:#fbfcfa;border:1px solid var(--line);border-radius:11px}.stage svg{width:min(100%,325px);height:auto;transition:transform .55s ease}.stage svg.turn{transform:rotate(180deg)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.field{margin-top:16px}select,button,input{font:inherit}select,button{background:white;border:1px solid #b6c7bf;color:var(--ink);padding:10px 12px;border-radius:8px}button{cursor:pointer}button.active,button:hover{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,select:focus-visible{outline:3px solid #a4d4bc}select{max-width:100%}.reference{display:flex;gap:16px;margin-top:15px}.reference>div{text-align:center;color:var(--sub);font-size:12px}.reference svg{width:90px;height:90px;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfcfa;padding:7px}.modes{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.modes button{font-size:12px;padding:7px 10px}.note{border-left:3px solid var(--gold);padding-left:14px;color:var(--sub);margin:22px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-top:13px}.tile{border:1px solid var(--line);background:white;border-radius:12px;padding:10px;cursor:pointer;text-align:center}.tile:hover,.tile.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.tile .chars{font-size:23px;font-weight:600}.tile small{display:block;color:var(--sub);font-size:11px}.bottom{border-top:1px solid var(--line);margin-top:25px;padding-top:18px;color:var(--sub);font-size:12px}input[type=range]{accent-color:var(--green);width:min(180px,65vw)}.technical{font-family:ui-monospace,monospace;color:var(--green);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.stage{min-height:290px}.box{padding:15px}}@media(prefers-reduced-motion:reduce){.stage svg{transition:none}}
</style></head><body><main class="wrap"><header><div class="eyebrow">Sinogram Ambigrams / Interactive geometry</div><div class="toolbar" style="justify-content:space-between"><h1 id="title">Rotation Lab</h1><label><span id="languageLabel">Language</span> <select id="lang"><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select></label></div><p id="intro" class="muted"></p></header>
<section class="box" style="margin-top:20px;border-left:5px solid #237063"><div class="eyebrow">C₂ · 180°</div><h2 id="c2Heading">Discover the exact half-turn decomposition</h2><p id="c2Intro" class="muted">See the invariant and changing components separately, move the rotation centre, and inspect published geometry experiments.</p><a id="c2Link" href="c2/" style="font-weight:700">Open C₂ Visual Research Lab →</a></section>

<footer class="bottom" id="foot"></footer></main><script src="kanjivg-geometry.js"></script><script>
const PATHS=window.SINOGRAM_KANJIVG_PATHS;const EXAMPLES=[{"a":"由","b":"甲","mode":"salience","desc":{"en":"Near-rotation pair; a short vertical stroke changes its apparent position.","zh":"近似旋转字对：竖画的位置发生改变。","ja":"近似回転ペア：縦画の位置が変わります。"}},{"a":"王","b":"玉","mode":"salience","desc":{"en":"Distinctive-dot attenuation: a small mark can change the intended reading.","zh":"弱化区别性点画：细小笔画会改变识读。","ja":"識別点の弱化：小さな点が読みを変えます。"}},{"a":"吉","b":"阜","mode":"salience","desc":{"en":"Highest-ranked distinct pair in the refined geometry dataset.","zh":"精细几何数据中排名第一的不同字配对。","ja":"精密幾何データにおける異字ペア第1位。"}},{"a":"旦","b":"百","mode":"salience","desc":{"en":"Structural near-match explored by raster and median-distance searches.","zh":"在栅格和中轴距离实验中发现的结构近似字对。","ja":"ラスター・中心線距離探索による構造的類似候補。"}},{"a":"圃","b":"鬱","mode":"salience","desc":{"en":"Dense-complexity stress case: high overlap can obscure individual identity.","zh":"高密度复杂字形压力测试：较高重叠度可能掩盖字形差异。","ja":"高密度・複雑字形の試験。重なりは識別性を隠すことがあります。"}},{"a":"圏","b":"鰯","mode":"salience","desc":{"en":"Complex candidate demonstrating why skeleton proximity differs from visual legibility.","zh":"复杂字候选：骨架接近不等于视觉上容易辨认。","ja":"複雑な候補：骨格の近さと見た目の識別性は異なります。"}},{"a":"圃","b":"園","mode":"salience","desc":{"en":"Shared enclosing structure produces a strong common visual core.","zh":"共有围合结构产生较大的共同视觉骨架。","ja":"共通の囲み構造が視覚的な核を形成します。"}},{"a":"回","b":"回","mode":"symmetry","desc":{"en":"Enclosure family: an almost half-turn-symmetric frame.","zh":"围合结构家族：接近180°对称的外框。","ja":"囲み構造：180°回転でほぼ不変な枠。"}},{"a":"目","b":"目","mode":"symmetry","desc":{"en":"C₂ self-rotation class, measured on canonical vector strokes.","zh":"C₂自旋转类型，采用标准矢量笔画测量。","ja":"C₂自己回転型。標準ベクトルストロークで測定。"}},{"a":"田","b":"田","mode":"symmetry","desc":{"en":"Internal grid as a rotationally symmetric structural anchor.","zh":"内部网格可作为旋转对称的结构锚点。","ja":"内部格子を回転対称な構造アンカーとして使用。"}},{"a":"昌","b":"昌","mode":"ids","desc":{"en":"Stacked-component hypothesis: slot proportions complicate symbolic symmetry.","zh":"上下叠加结构假设：部件比例会影响符号层面对称性。","ja":"上下構成の仮説：配置比率が記号上の対称性に影響。"}},{"a":"国","b":"国","mode":"ids","desc":{"en":"Enclosure composition: separate the frame idea from the interior.","zh":"围合部件结构：将外框与内部部件分别观察。","ja":"囲み構成：外枠と内部要素を分けて観察。"}},{"a":"上","b":"下","mode":"comparison","desc":{"en":"Mirror-trap negative control: reflection resemblance is not 180° rotation.","zh":"镜像干扰对照：镜面对称不等于180°旋转。","ja":"鏡映トラップ：鏡映と180°回転は異なります。"}},{"a":"国","b":"圃","mode":"ids","desc":{"en":"Enclosure-to-enclosure exploratory composition: compare the outer frame against different interior structures.","zh":"围合结构探索：比较相似的外框与不同的内部笔画。","ja":"囲み構造の探索：共通する外枠と異なる内部ストロークを比較します。"}},{"a":"昌","b":"旦","mode":"overlay","desc":{"en":"Stacked components versus a lower baseline: examine slot proportions and changed stroke placements.","zh":"叠加部件与底部横画：观察部件比例和笔画位置的差异。","ja":"上下要素と下部の横線：配置比率とストロークの位置を比較します。"}},{"a":"目","b":"田","mode":"comparison","desc":{"en":"Grid-structure comparison: inspect how interior horizontal and vertical strokes affect the rotated shape.","zh":"内部网格对比：观察横画和竖画怎样影响旋转后的形状。","ja":"内部格子の比較：横線と縦線が回転後の形に与える影響を調べます。"}}];
const MODES=['salience','overlay','common','symmetry','comparison','ids'];
const TEXT={
en:{intro:'16 examples from simple symmetries to densely structured characters. Select a pair, change the construction method, inspect the reference strokes, and rotate the same result by 180°.',demo:'Live drawing',method:'Methods',choose:'Select a pair',mode:'Construction',rotate:'Rotate 180°',reset:'Reset',normal:'Upright',turned:'Rotated',tolerance:'Stroke proximity',a:'A · upright reference',b:'B · rotated reference',gallery:'Browse examples',galleryHeading:'From simple strokes to complex structures',galleryIntro:'The gallery includes both promising pairs and deliberately challenging shapes. Click any card to load it into the live drawing.',modes:['Salience blend','Overlay','Common core','C₂ overlay','Compare shapes','IDS layout'],explain:['Combine A and R(B). Thicker strokes are close to the other glyph, thinner strokes are distinctive. Inspired by the stroke-weight approach explored in the source generator.','Overlay the two canonical stroke structures. This reveals where geometric agreement occurs without choosing which strokes dominate.','Show only strokes near the opposite skeleton. A simplified common-structure extraction; change the tolerance to explore the fit.','Overlay original and half-turned strokes for a qualitative comparison. This mode is NOT an exact even-component decomposition; use the separate C₂ Visual Lab for that.','Show A and the 180°-rotated B simultaneously in separate hues. This is a geometric search diagnostic, not an ambigram synthesis method.','Highlight approximate upper/lower or enclosing component regions to illustrate how IDS structure constrains rotation. This is a spatial preview, not a parsed IDS tree.'],methodInfo:'The examples are drawn from KanjiVG vector paths embedded in the original experimental catalogue. Different views illustrate distinct operations; they are not all outputs of the same published algorithm.',foot:'Methods and source data: Sinogram Ambigrams project. Vector stroke geometry: KanjiVG (CC BY-SA 3.0). Geometric ranking is a tool for discovering and exploring designs, not a substitute for observing how the rotated drawing reads.'},
zh:{intro:'16组从简单对称到复杂密集字形的实例。选择字对、切换构造方法、查看参考笔画，再将同一幅图旋转180°。',demo:'交互字形',method:'方法',choose:'选择字对',mode:'构造方式',rotate:'旋转180°',reset:'重置',normal:'正向',turned:'旋转后',tolerance:'笔画接近阈值',a:'A · 正向参考',b:'B · 旋转参考',gallery:'实例浏览',galleryHeading:'从简单笔画到复杂结构',galleryIntro:'既包含有潜力的字对，也包含具有挑战性的复杂字形。点击卡片载入。',modes:['显著性融合','叠加','共同骨架','C₂ 叠加','形状比较','IDS 布局'],explain:['叠加 A 与旋转后的 B。接近的笔画加粗，区别性笔画变细；源自笔画权重实验思路。','将两个标准字形骨架叠加，直接观察几何相似之处。','仅显示接近另一字形骨架的笔画，以阈值探索共同结构。','叠加字形与其180°旋转后的笔画，直观比较两者。这并非严格的偶分量分解；精确 C₂ 分解请打开独立实验室。','用两种颜色同时显示 A 与旋转后的 B。这是几何搜索诊断视图，而非字谜合成。','按位置为上下部件或围合部件着色，展示 IDS 结构如何限制旋转。这是空间示意，并非完整 IDS 解析。'],methodInfo:'字形来自原实验目录中嵌入的 KanjiVG 矢量路径。不同视图展示不同几何操作，并非同一算法的全部输出。',foot:'方法与数据：Sinogram Ambigrams 项目。字形矢量来源：KanjiVG (CC BY-SA 3.0)。几何排序用于探索图形设计；识读效果仍可直接观察。'},
ja:{intro:'単純な対称形から複雑な字形まで16例。ペアと手法を選び、参照ストロークを見ながら同じ図形を180°回転できます。',demo:'インタラクティブ図形',method:'手法',choose:'ペアを選択',mode:'構成方法',rotate:'180°回転',reset:'リセット',normal:'通常',turned:'回転後',tolerance:'ストローク近接しきい値',a:'A · 正向きの参照',b:'B · 回転した参照',gallery:'例を探す',galleryHeading:'単純な線から複雑な構造へ',galleryIntro:'有望な組み合わせと、意図的に難しい字形の両方を掲載しています。カードをクリックして表示。',modes:['強調度ブレンド','重ね合わせ','共通骨格','C₂ 重ね合わせ','形状比較','IDS 配置'],explain:['Aと180°回転したBを重ね、近い線を太く、固有の線を細くします。元のストローク強調の実験に基づく方法です。','標準ストロークを重ね、どこで形状が近いかを表示します。','相手の骨格に近いストロークのみを抽出し、しきい値で共通構造を探索します。','元の字形と半回転後の筆画を重ねて定性的に比較します。厳密な偶成分分解ではありません。専用C₂ラボをご覧ください。','Aと回転後のBを二色で表示する幾何学的診断です。アンビグラムの生成ではありません。','上下の要素や囲み要素を位置に応じて色分けし、IDS構造と回転の関係を示します。実際のIDS構文木解析ではありません。'],methodInfo:'字形は元の実験カタログ内のKanjiVGベクトルパスから取得しました。各表示は異なる幾何学的操作を示し、すべてが同一アルゴリズムの出力ではありません。',foot:'手法とデータ：Sinogram Ambigrams プロジェクト。ストローク形状：KanjiVG (CC BY-SA 3.0)。幾何学的順位はデザイン探索の手段です。回転後の読みは図を見て確かめられます。'}};
let lang='en',selected=0,mode='salience',rotated=false;const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
function drawSvg(c,rot=false){const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 109 109');const g=document.createElementNS(NS,'g');if(rot)g.setAttribute('transform','rotate(180 54.5 54.5)');for(const d of PATHS[c]){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#203330');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-linecap','round');g.appendChild(p)}svg.appendChild(g);return svg}
function points(path,n=24){const len=path.getTotalLength(),out=[];for(let i=0;i<n;i++){let p=path.getPointAtLength(len*i/(n-1));out.push([p.x,p.y])}return out}
function distRatio(p,other,tau){let count=0;for(const [x,y] of p){if(other.some(([a,b])=>Math.hypot(x-a,y-b)<=tau))count++}return count/p.length}
function mkPath(d,color,width,opacity,transform){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width',String(width));p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');p.setAttribute('opacity',String(opacity));if(transform)p.setAttribute('transform',transform);return p}
function render(){const ex=EXAMPLES[selected],t=TEXT[lang],tau=Number($('tolerance').value);$('tolValue').textContent=tau.toFixed(2);$('pairTitle').textContent=ex.a+' ↔ '+ex.b;$('desc').textContent=ex.desc[lang];$('sourceA').replaceChildren(drawSvg(ex.a));$('sourceB').replaceChildren(drawSvg(ex.b,true));const pathsA=PATHS[ex.a].map(d=>mkPath(d,'#203330',5,1)),pathsB=PATHS[ex.b].map(d=>mkPath(d,'#203330',5,1));const aPts=pathsA.map(p=>points(p)),bPts=pathsB.map(p=>points(p).map(([x,y])=>[109-x,109-y]));let allA=aPts.flat(),allB=bPts.flat(),art=$('art');art.replaceChildren();const flip='rotate(180 54.5 54.5)';
 if(mode==='ids'){const enclosure=['国','回','圃','圏','園','固','困','菌'].includes(ex.a);PATHS[ex.a].forEach(d=>{const p=mkPath(d,'#237063',5,.9);const box=p.getBBox();const mid=box.y+box.height/2;const frame=enclosure&&(box.width>75||box.height>75);p.setAttribute('stroke',frame?'#bd7345':mid<54.5?'#237063':'#354d82');art.appendChild(p)});}
 else if(mode==='symmetry'){const choose=ex.a;for(const d of PATHS[choose]){art.appendChild(mkPath(d,'#203330',4,.7));art.appendChild(mkPath(d,'#237063',4,.45,flip));}}
 else{for(let side=0;side<2;side++){const pp=side?pathsB:pathsA,cloud=side?bPts:aPts,other=side?allA:allB;pp.forEach((p,i)=>{const ratio=distRatio(cloud[i],other,tau),common=ratio>=.5;if(mode==='common'&&!common)return;const width=mode==='salience'?(common?9.5:2.6):mode==='common'?7:4;const color=mode==='comparison'?(side?'#bd7345':'#237063'):'#203330';const op=mode==='salience'?(side?.55:.95):mode==='overlay'?(side?.5:.8):mode==='comparison'?.88:.85;p.setAttribute('stroke-width',String(width));p.setAttribute('stroke',color);p.setAttribute('opacity',String(op));if(side)p.setAttribute('transform',flip);art.appendChild(p)})}}
 art.classList.toggle('turn',rotated);$('reading').textContent=(rotated?t.turned+': '+ex.b:t.normal+': '+ex.a);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-index]').forEach(b=>b.classList.toggle('sel',Number(b.dataset.index)===selected));$('explain').textContent=t.explain[MODES.indexOf(mode)];}
const C2_TEXT={
en:{heading:"Discover the exact half-turn decomposition",intro:"See invariant and changing components separately, move the rotation centre, and inspect the measured geometry experiments.",link:"Open C₂ Visual Research Lab →"},
zh:{heading:"探索精确的 C₂ 半周旋转分解",intro:"分别观察旋转不变与变化分量、移动旋转中心，并查看已经测量的几何实验。",link:"打开 C₂ 可视化研究实验室 →"},
ja:{heading:"C₂ 半回転の厳密な分解を体験",intro:"不変成分と変化成分を分け、回転中心を動かし、記録済みの幾何実験を比較します。",link:"C₂ ビジュアル研究ラボを開く →"}
};
function text(){const t=TEXT[lang];const x=C2_TEXT[lang];$('c2Heading').textContent=x.heading;$('c2Intro').textContent=x.intro;$('c2Link').textContent=x.link;document.documentElement.lang=lang;for(const [a,b] of [['intro','intro'],['demoTitle','demo'],['methodTitle','method'],['chooseTitle','choose'],['modeLabel','mode'],['rotate','rotate'],['reset','reset'],['tolLabel','tolerance'],['aLabel','a'],['bLabel','b'],['methodInfo','methodInfo'],['galleryTitle','gallery'],['galleryHeading','galleryHeading'],['galleryIntro','galleryIntro'],['foot','foot']])$(a).textContent=t[b];$('modes').replaceChildren();for(let i=0;i<MODES.length;i++){const b=document.createElement('button');b.type='button';b.dataset.mode=MODES[i];b.textContent=t.modes[i];b.onclick=()=>{mode=MODES[i];render()};$('modes').appendChild(b)}$('pairSelect').replaceChildren();$('gallery').replaceChildren();EXAMPLES.forEach((p,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=p.a+' ↔ '+p.b+' · '+t.modes[MODES.indexOf(p.mode)] ;$('pairSelect').appendChild(opt);let b=document.createElement('button');b.type='button';b.className='tile';b.dataset.index=i;let ch=document.createElement('div');ch.className='chars';ch.textContent=p.a+' ↔ '+p.b;let small=document.createElement('small');small.textContent=t.modes[MODES.indexOf(p.mode)];b.append(ch,small);b.onclick=()=>{selected=i;mode=EXAMPLES[i].mode;rotated=false;$('pairSelect').value=i;render();window.scrollTo({top:0,behavior:'smooth'})};$('gallery').appendChild(b)});$('pairSelect').value=selected;render()}
$('lang').onchange=e=>{lang=e.target.value;text()};$('pairSelect').onchange=e=>{selected=+e.target.value;mode=EXAMPLES[selected].mode;rotated=false;render()};$('tolerance').oninput=render;$('rotate').onclick=()=>{rotated=!rotated;render()};$('reset').onclick=()=>{rotated=false;mode=EXAMPLES[selected].mode;$('tolerance').value=1.5;render()};text();
</script></body></html>
