name: Verify pinned PRC method examples

on:
  push:
    branches:
      - main
      - docs/research-tracks-gallery-20261108
    paths:
      - "code/build_prc_method_gallery.py"
      - "code/prc_construct.py"
      - "code/prc_r_odd.py"
      - "code/prc_harmonic.py"
      - "code/prc_ab_fusion.py"
      - "evaluation/recognition/generated/**"
      - ".github/workflows/method-gallery-prc.yml"
  pull_request:
    branches: [main]
    paths:
      - "code/build_prc_method_gallery.py"
      - "code/prc_construct.py"
      - "code/prc_r_odd.py"
      - "code/prc_harmonic.py"
      - "code/prc_ab_fusion.py"
      - "evaluation/recognition/generated/**"
      - ".github/workflows/method-gallery-prc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric and graphics dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Download checksum-pinned licensed source
        run: bash scripts/download_prc_sources.sh
      - name: Execute the integrated operators in a fresh output directory
        run: python code/build_prc_method_gallery.py --graphics data/prc/graphics.txt --out /tmp/prc-method-regenerated
      - name: Assert all published source-derived images are byte-for-byte reproducible
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          committed=Path('evaluation/recognition/generated')
          reproducible=Path('/tmp/prc-method-regenerated')
          published=json.loads((committed/'manifest.json').read_text())
          rebuilt=json.loads((reproducible/'manifest.json').read_text())
          assert published==rebuilt, 'Method manifest changed on independent regeneration'
          expected={'cn-natural-self','cn-natural-pair','cn-source-union',
                    'cn-centre-optimisation','cn-extremity-reconciliation',
                    'cn-sector-deterministic','cn-sector-search','cn-width-fixed',
                    'cn-r-odd','cn-harmonic','cn-ab-fusion'}
          assert len(published['items'])==22
          assert {x['method'] for x in published['items']}==expected
          assert {p.name for p in committed.glob('*.svg')}=={x['file'] for x in published['items']}
          for entry in published['items']:
              a=(committed/entry['file']).read_bytes()
              b=(reproducible/entry['file']).read_bytes()
              assert a==b, 'Byte mismatch for '+entry['file']
              assert hashlib.sha256(a).hexdigest()==entry['svg_sha256']
          print('PASS: 22 pinned PRC method SVGs byte-identically reproduced')
          PY
      - name: Archive independently regenerated examples and licence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prc-method-gallery-reproduction
          path: |
            /tmp/prc-method-regenerated/
            licenses/ARPHICPL.TXT
          retention-days: 30
          if-no-files-found: warn
